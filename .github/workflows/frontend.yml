name: Frontend CI

on:
  push:
    branches: [main, hell, jarvis-mobile]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main, hell, jarvis-mobile]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Use the reviewed npm toolchain
        run: npm install --global npm@11.19.0

      - run: npm ci
      - name: Audit dependencies
        run: npm audit
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          # Optional: when the secret is unset the build still succeeds and the
          # leaderboard is disabled (see src/lib/supabase.ts). No placeholder,
          # so a keyless CI build doesn't bake in a bogus anon key.
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  # HELL build tester: drive the production build in a headless iPhone 12
  # (dashboard, chat, memory, tasks, hologram builder incl. voice/AI building,
  # sign-in, desktop app). The server API is faked, so no backend or model is
  # needed. Separate from `build` so its result is reported on its own.
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Use the reviewed npm toolchain
        run: npm install --global npm@11.19.0

      - run: npm ci
      - run: npm run build
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the built app (iPhone 12)
        run: npm run test:smoke
